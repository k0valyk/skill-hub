[package]
name = "skillhub"
version = "0.3.1"
description = "Skill Hub вЂ” Р»РѕРєР°Р»СЊРЅР° Р±С–Р±Р»С–РѕС‚РµРєР° СЃРєС–Р»С–РІ, РїР»Р°РіС–РЅС–РІ С– Р°РіРµРЅС‚С–РІ РґР»СЏ OpenCode"
authors = ["k0valyk"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "skillhub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[workspace]
members = ["cli"]

[[bin]]
name = "skillhub"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
tokio = { version = "1", features = ["full"] }
keyring = "2"
sha2 = "0.10"
walkdir = "2"
chrono = "0.4"
url = "2"
regex = "1"
uuid = { version = "1", features = ["v4"] }
dirs = "5"
zip = { version = "2", default-features = true }
open = "5"
base64 = "0.22"
rfd = "0.15"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
